name: Сборка exe для Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Зависимости
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Иконка
        run: python make_icon.py
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Сборка
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name PultG733Ajazz --icon assets\app.ico --version-file version_info.txt main.py

      - name: Проверка импорта модулей
        run: python -c "import hid, PySide6; print('ok', hid.__file__)"

      - uses: actions/upload-artifact@v4
        with:
          name: PultG733Ajazz
          path: dist/PultG733Ajazz.exe

      - name: Публикация в Releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" dist/PultG733Ajazz.exe \
            --title "Пульт G733 + AJAZZ (сборка ${GITHUB_RUN_NUMBER})" \
            --notes "Скачайте PultG733Ajazz.exe и запустите. Перед запуском закройте G HUB и программу AJAZZ." \
            --latest
